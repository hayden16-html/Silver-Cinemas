<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silver Cinemas</title>

    <link rel="stylesheet" href="./stylesheet.css">
</head>


<body>

    <header class="navbar">

        <!-- Silver Cinemas logo -->
        <a href="index.html" class="logo">
            <img src="./assets/Untitled_design-removebg-preview.png" alt="Silver Cinemas">
        </a>


        <!-- Search bar -->
        <div class="search-container">

            <input
                type="text"
                placeholder="Search for a movie"
            >

            <button class="clear-button">
                ×
            </button>

        </div>


        <!-- Right side of navigation -->
        <div class="nav-actions">

            <!-- Login button -->
            <button class="login-button">
                Login/Sign up
            </button>


            <!-- Hamburger menu -->
            <div class="menu-container">

                <button
                    class="menu-button"
                    aria-label="Open menu"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>


                <!-- Menu links -->
                <nav class="menu">

                    <a href="./index.html">Home</a>

                    <a href="./Food&Drinks.html">Food & Drinks</a>

                    <a href="about.html">About Us</a>

                    <a href="contact.html">Contact</a>

                </nav>

            </div>

        </div>

    </header>

    <!-- This was made using the help of mozilla developer network for the concepts -->

    <main>

        <!-- carousel -->
        <!-- Slideshow container -->
        <div class="slideshow-container">

            <!-- Full-width images with number and caption text -->
            <div class="mySlides fade">
                <div class="numbertext">1 / 3</div>
                <img src="./assets/Toy Story 5 poster.webp" alt="Toy story 5">
                <div class="text"></div>
            </div>

            <div class="mySlides fade">
                <div class="numbertext">2 / 3</div>
                <img src="./assets/Spider man slider.webp" style="width:100%">
                <div class="text"></div>
            </div>

            <div class="mySlides fade">
                <div class="numbertext">3 / 3</div>
                <img src="./assets/The Odyssey.webp" style="width:100%">
                <div class="text"></div>
            </div>

            <div>
                <!-- Next and previous buttons -->
                <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
            <br>

            <!-- The dots/circles -->
            <div class="dot-container">
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
                <span class="dot" onclick="currentSlide(3)"></span>
            </div>
        </div>
<!-- This was taken from the W3Schools slideshow tutorial, and changed slightly to meet the needs of the project -->

        <section class="movie-carousels">

            <h2 class="now-showing">Now Showing</h2>

            <div class="carousel-wrapper">

                    <button class="carousel-left">
                        &#10094;
                    </button>

                <div class="now-showing-carousel">
                    
                    <article class="movie-card">
                        <img src="./assets/Spider man poster.webp" alt="Spider man: A brand New Day poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/Disclosure day poster.webp" alt="Disclosure day poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/Obsession poster.webp" alt="Obsession poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/supergirl poster.webp" alt="Supergirl poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/Toy Story 5 poster(1).webp" alt="Toy Story 5 poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/Backrooms poster.webp" alt="The Odyssey poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/Michael Poster.webp" alt="The Odyssey poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/Moana LiveAction Poster.webp" alt="The Odyssey poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>
                    <article class="movie-card">
                        <img src="./assets/Minions & Monsters poster.webp" alt="The Odyssey poster">
                        <p><button class="card-button">Times & Tickets</button></p>
                    </article>

                </div>
                    <button class="carousel-right">
                        &#10095;
                    </button>
            </div>
        </section> <!-- This was made using the help of mozilla developer network for the concepts
                    and w3schools for the help of the product card design -->


    </main>
    <script src="./movie-carousel.js"></script>
    <script src="./carousel.js"></script>
    <script src="./script.js"></script>

</body>

</html>
