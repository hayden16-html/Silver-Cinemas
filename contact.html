<body class="contact-page">

<nav class="navbar">

        <!-- Silver Cinemas logo -->
        <a href="index.html" class="logo">
            <img src="./assets/Untitled_design-removebg-preview.png" alt="Silver Cinemas">
        </a>


        <!-- Search bar -->
        <div class="search-container">

            <input type="text" placeholder="Search for a movie">
            <button class="clear-button">
                ×
            </button>

        </div>


        <!-- Right side of navigation -->
        <div class="nav-actions">

            <!-- Login button -->
            <button class="login-button">
                Login/Sign up
            </button>


            <!-- Hamburger menu -->
            <div class="menu-container">

                <button
                    class="menu-button"
                    aria-label="Open menu"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>


                <!-- Menu links -->
                <nav class="menu">

                    <a href="./index.html">Home</a>

                    <a href="./Food&Drinks.html">Food & Drinks</a>

                </nav>

            </div>

        </div>

    </nav>

<!-- Contact details and the message form sit inside this section. -->
<div class="contact-wrapper">
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p>If you have any questions or inquiries, please fill out the form below and we will get back to you as soon as possible.</p>
        </section>

    <!-- Visitors can send a message using this form. -->
    <div class="contact-form">
          <!-- modify this form HTML and place wherever you want your form -->
      <form action="https://formspree.io/f/myeygqaw" method="POST">
        <h2>Contact Us</h2>
        <label>
          First Name:
          <input type="text" name="first_name">
        </label>
        <label>
          Last Name:
          <input type="text" name="last_name">
        </label>
        <label>
          Your email:
          <input type="email" name="email">
        </label>
        <label>
          Your message:
          <textarea name="message"></textarea>
        </label>
        <!-- your other form fields go here -->
        <button type="submit">Send</button>
      </form>
    </div>


<script src="search.js"></script>
